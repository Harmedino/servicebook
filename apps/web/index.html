<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online booking, calendar and customer management for salons, barbers, spas and other service businesses." />
    <meta name="theme-color" content="#0c1a14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ServiceBook · Online booking for service businesses</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      try {
        var t = localStorage.getItem("servicebook_theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
